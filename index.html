<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Ethereal Expanse v8.1</title>
<style>body{margin:0;background:#02040c;color:#9ab;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head><body><p id="s">Loading Ethereal Expanse v8.1…</p>
<script>
(async function(){
  const n = 12; const parts = [];
  for (let i = 0; i < n; i++) {
    const r = await fetch('v81p' + i + '.txt');
    if (!r.ok) throw new Error('missing part ' + i);
    parts.push(await r.text());
    document.getElementById('s').textContent = 'Loading… ' + (i+1) + '/' + n;
  }
  const bin = atob(parts.join(''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  document.open(); document.write(new TextDecoder().decode(bytes)); document.close();
})().catch(e => { document.getElementById('s').textContent = 'Load failed: ' + e; });
</script></body></html>
