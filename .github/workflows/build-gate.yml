name: Build gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  size-and-smoke:
    name: Reject stub HTML + smoke canonical build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Size gate + static smoke (sfx, applyLoadedSave)
        run: node scripts/check-builds.mjs

      - name: Fail if this commit touched a stub vN.html
        run: |
          CHANGED="$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD || true)"
          echo "Changed files:"
          echo "$CHANGED"
          CHANGED_FILES="$CHANGED" node scripts/check-builds.mjs --changed

  headless-smoke:
    name: Headless open canonical HTML
    runs-on: ubuntu-latest
    needs: size-and-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Open highest full build
        run: node scripts/headless-smoke.cjs
